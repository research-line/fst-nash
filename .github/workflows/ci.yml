name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy biopython matplotlib mpmath pytest
    - name: Check Python Syntax & Compilation
      run: |
        python -m compileall code scripts .
    - name: Run Pytest Test Suite
      run: |
        pytest
    - name: Verify Pre-Review Evidence Ledger
      run: |
        python scripts/validation_evidence_ledger.py
