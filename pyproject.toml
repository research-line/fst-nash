[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fst-nash"
version = "1.3.0"
description = "Game-Theoretic Diagnostics for Chaperone Systems: A Potential-Game Test Maps the Goloubinoff Symmetry Landscape"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Functional Stability Theory Research Team" }
]
keywords = [
    "game-theory",
    "potential-game",
    "chaperones",
    "protein-folding",
    "non-equilibrium-thermodynamics",
    "goloubinoff-landscape",
    "fst-nash",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy",
    "scipy",
    "biopython",
    "matplotlib",
    "mpmath"
]

[project.urls]
"Homepage" = "https://github.com/research-line/fst-nash"
"Repository" = "https://github.com/research-line/fst-nash.git"
"Preprint DOI" = "https://doi.org/10.5281/zenodo.21014120"
"Concept DOI" = "https://doi.org/10.5281/zenodo.20402751"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts", "code"]
addopts = "-v"
